<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="https://unpkg.com/chota@latest" />
    <style>
      body.dark {
        --font-color: #481dc9;
        --color-grey: #ccc;
        --color-darkGrey: #777;
      }
      .container {
        max-width: 800px; /* adjust this as desired */
        margin-left: auto;
        margin-right: auto;
      }
      .container.wide {
        max-width: min(98vw, 1700px);
        width: 100%;
      }
      .table-scroll {
        overflow-x: auto;
      }
      .table-scroll table {
        min-width: 1200px;
        font-size: 1.4rem;
      }
      .table-scroll td {
        border-bottom: 1px solid var(--color-lightGrey);
      }

      /*@media (min-width: 800px) {
        .container {
          margin-left: 8vw;
          margin-right: 8vw;
        }
      }*/
    </style>
  </head>

  <body id="top">
    <div class="container{% if page.wide %} wide{% endif %}">
      <section id="all">{{ content}}</section>
    </div>
  </body>
</html>
